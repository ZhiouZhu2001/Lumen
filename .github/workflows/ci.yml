name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://lumen_ci:ci_only@127.0.0.1:5432/lumen_ci
      REDIS_URL: redis://127.0.0.1:6379/0
      SQL_ECHO: "false"
      OPENAI_API_KEY: ""
      GOOGLE_BOOKS_API_KEY: ""
      DAILY_AI_CALL_CAP: "100"
      TRUSTED_PROXY_IPS: "[]"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lumen_ci
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: lumen_ci
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U lumen_ci -d lumen_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.15"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - name: Install project Python
        run: uv python install
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Check Python lint
        run: uv run --no-sync ruff check app scripts tests evals integration_tests
      - name: Check Python formatting
        run: uv run --no-sync ruff format --check app scripts tests evals integration_tests
      - name: Apply migrations to temporary database
        run: uv run --no-sync alembic upgrade head
      - name: Check migration and model agreement
        run: uv run --no-sync alembic check
      - name: Run offline unit tests
        run: uv run --no-sync python -m pytest -q
      - name: Run PostgreSQL and Redis integration tests
        run: uv run --no-sync python -m pytest -q integration_tests

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check frontend lint
        run: npm run lint
      - name: Run frontend tests
        run: npm test
      - name: Build frontend and check TypeScript
        run: npm run build
